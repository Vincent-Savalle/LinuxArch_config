# kitty.conf generated by Confitty, https://confitty.app
# Target: Kitty 0.48.0
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor
modify_font cell_height 120%

# --- Cursor ---
cursor #abb2bf
cursor_text_color #282c34
cursor_shape beam
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000
wheel_scroll_multiplier 3

# --- Mouse ---
url_color #61afef
underline_hyperlinks always
copy_on_select clipboard
strip_trailing_spaces smart

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 0pt
window_padding_width 4
active_border_color #61afef
hide_window_decorations yes

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 1
tab_powerline_style slanted
active_tab_foreground #abb2bf
active_tab_background #c678dd
inactive_tab_foreground #7d838e
inactive_tab_background #454953

# --- Colors ---
foreground #ffffff
background #0a0e14
background_opacity 0.8
selection_foreground #0a0e14
selection_background #273747
color0 #01060e
color1 #ff3333
color2 #b8cc52
color3 #e7c547
color4 #36a3d9
color5 #f07178
color6 #95e6cb
color7 #c7c7c7
color8 #323232
color9 #ff6565
color10 #eafe84
color11 #fff779
color12 #68d5ff
color13 #ffa3aa
color14 #c7fffd
mark1_foreground #000000
mark1_background #ffff00
mark2_foreground #000000
mark2_background #00ffff
mark3_foreground #ffffff
mark3_background #ff0000

# --- Advanced ---
allow_remote_control socket-only
